name: Rust

on:
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install latest nightly
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly-2023-02-28
    - name: Crate cache
      uses: actions/cache@v3
      with:
        key: ubuntu-latest-cargo-cache
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ./target
    - name: Install GTK
      run: sudo apt update && sudo apt install libgtk-3-dev	
    - name: Check `uk-app` has no GUI dependencies
      run: |
        set -o pipefail
        if cargo tree -p uk-app | grep -Eq 'egui|eframe|rfd|winit'; then
          echo "::error::uk-app must not depend on GUI crates (egui/eframe/rfd/winit)"
          cargo tree -p uk-app | grep -E 'egui|eframe|rfd|winit'
          exit 1
        fi
    - name: Check `uk-cli` has no GUI dependencies
      run: |
        set -o pipefail
        if cargo tree -p uk-cli | grep -Eq 'egui|eframe|rfd|winit|uk-ui'; then
          echo "::error::uk-cli must be a toolkit-free frontend (no egui/eframe/rfd/winit/uk-ui)"
          cargo tree -p uk-cli | grep -E 'egui|eframe|rfd|winit|uk-ui'
          exit 1
        fi
    - uses: LoliGothick/clippy-check@master
      name: Check clippy
      with:
          token: ${{ secrets.GITHUB_TOKEN }}
